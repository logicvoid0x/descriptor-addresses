# Dependency update policy.
#
# The governing rule: **no auto-merge on dependency bumps.** A small dependency
# graph exists precisely so a human can read every change to it, and auto-merge
# would hand that reading back to a robot — which is the whole argument for
# choosing bare miniscript + bitcoin over a larger wallet framework in the first
# place. There is deliberately no `automerge` key below, and no auto-merge
# workflow anywhere in this repository.
#
# Note that GitHub's auto-merge is a repository setting as well as a workflow
# concern. Keeping this file free of it is necessary but not sufficient: the
# repository's "Allow auto-merge" setting must stay off too.

version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Grouped so the reviewer reads one coherent diff of the graph rather than
    # five separate pull requests that each look harmless alone.
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  # The Actions themselves are a supply chain too — a compromised action runs
  # with the repository's credentials.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
